<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with DunderBot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Chat with DunderBot</h1>
        <div class="card mt-4">
            <div class="card-body">
                <div id="chat-window" class="mb-3" style="height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px;">
                    <!-- Chat messages will appear here -->
                </div>
                <div class="input-group">
                    <textarea id="user-input" class="form-control" placeholder="Enter a message..." rows="3" style="resize: none;"></textarea>
                    <button id="send-button" class="btn btn-primary">Send</button>
                </div>
                <div class="form-check form-switch mt-3">
                    <input class="form-check-input" type="checkbox" id="voice-response">
                    <label class="form-check-label" for="voice-response">Voice response</label>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/index.js"></script>
</body>
</html>
